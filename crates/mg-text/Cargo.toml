[package]
name = "mg-text"
description = "Text-to-coverage-bitmap rendering through Windows DirectWrite (complex scripts, font fallback). Only crate with DirectWrite/Direct2D unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
  "std",
  "Foundation_Numerics",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
] }

[lints]
workspace = true
